<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Loja Online</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
      <a href="../index.html" class="btn-home">Home</a>
    </header>

    <main>
      <section id="produtos">
        <h2>Selecione os seus Produtos</h2>

        <form id="filtros" class="barra-filtros" onsubmit="event.preventDefault()">
          <div class="controlo-grupo">
            <label for="pesquisa-input">Pesquisar:</label>
            <input
              type="text"
              id="pesquisa-input"
              placeholder="Procurar produto..."
            />
          </div>

          <div class="controlo-grupo">
            <label for="categoria-select">Categoria:</label>
            <select id="categoria-select">
              <option value="todas">Todas as categorias</option>
            </select>
          </div>

          <div class="controlo-grupo">
            <label for="ordenar-select">Ordenar:</label>
            <select id="ordenar-select">
              <option value="padrao">Padrão</option>
              <option value="asc">Preço: Crescente</option>
              <option value="desc">Preço: Decrescente</option>
            </select>
          </div>
        </form>

        <div id="lista-produtos" class="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>Produtos Selecionados</h2>
        <div id="lista-cesto" class="lista-produtos"></div>
        <h3>Custo total: <span id="preco-total">0.00 €</span></h3>

        <form id="checkout-area" class="checkout-box" onsubmit="event.preventDefault()">
          <label class="checkbox-label" for="estudante-checkbox">
            <input type="checkbox" id="estudante-checkbox" />
            Sou estudante DEISI
          </label>

          <div class="controlo-grupo">
            <label for="cupao-input">Cupão de desconto:</label>
            <input type="text" id="cupao-input" placeholder="Ex: black-friday" />
          </div>

          <button type="button" id="comprar-btn" class="btn-comprar">
            Finalizar Compra
          </button>

          <output id="mensagem-compra" class="resultado-compra"></output>
        </form>
      </section>
    </main>

    <footer>
      <p>DIW 2026 — Loja Online</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
